[package]
name = "door-server"
version = "0.2.0"
authors = ["Markus Reiter <me@reitermark.us>"]
edition = "2024"
publish = false

[features]
embedded-hal = ["dep:embedded-hal"]

[dependencies]
embedded-hal = { version = "1", optional = true }
env_logger = "0.11"
log = "0.4"
rppal = { version = "0.22", features = ["embedded-hal"] }
serde_json = "1"
uuid = "1"
ws2812-spi = { version = "0.5.1", features = ["std"] }
smart-leds = "0.4.0"
ekey = "0.6.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
esphome-native-api = "3.0.0"
mac_address = "1.1.8"

[[example]]
name = "test"
path = "examples/test.rs"
required-features = ["embedded-hal"]

[lib]
name = "door_server"
path = "src/lib.rs"

[[bin]]
name = "door-server"
path = "src/bin/door_server/main.rs"
